<!-- DÁN SCRIPT HACK TAB MỚI VÀO ĐÂY (Thay thế đoạn cũ) -->
    <script>
      window.addEventListener('load', () => {
        // Đợi React render giao diện xong
        setTimeout(() => {
          // 1. Quét tìm thanh Menu đang chứa các tab hiện hành
          const buttons = Array.from(document.querySelectorAll('button'));
          const plannerBtn = buttons.find(btn => btn.textContent.includes('Nhà quy hoạch'));
          
          if (plannerBtn) {
            const tabBar = plannerBtn.parentElement; // Khung chứa 3 nút tab gốc
            const mainContainer = tabBar.parentElement; // Khung lớn chứa cả Tab và Nội dung bên dưới
            
            // 2. Tạo nút Tab "Hệ thống AI"
            const aiBtn = document.createElement('button');
            aiBtn.className = plannerBtn.className.replace('border-b-2 border-sky-500 text-sky-600', 'text-slate-500 hover:text-slate-700'); 
            aiBtn.textContent = 'Hệ thống AI';
            aiBtn.style.marginLeft = '16px'; 
            
            tabBar.appendChild(aiBtn); // Gắn nút lên thanh tab
            
            // 3. Tạo khung chứa Iframe AI (ẩn mặc định)
            const aiContainer = document.createElement('div');
            aiContainer.style.display = 'none'; 
            aiContainer.innerHTML = `
              <div style="width: 100%; height: 900px; margin-top: 24px; background: white; border-radius: 16px; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); border: 1px solid #f1f5f9; overflow: hidden;">
                <iframe src="https://6b0a78c47679ffcadc.gradio.live" style="width: 100%; height: 100%; border: none;" title="Hệ thống AI Traffic"></iframe>
              </div>
            `;
            
            // Chèn khung AI vào chung nhà với nội dung React
            mainContainer.appendChild(aiContainer);
            
            const allTabs = tabBar.querySelectorAll('button');
            
            // 4. Logic chuyển Tab siêu an toàn
            aiBtn.onclick = () => {
               // Quét tất cả các thành phần nằm cùng cấp với thanh Tab
               Array.from(mainContainer.children).forEach(child => {
                  // Ẩn nội dung React (Bỏ qua thanh Tab và khung AI)
                  if (child !== tabBar && child !== aiContainer) {
                     child.style.display = 'none';
                  }
               });
               // Hiện khung AI
               aiContainer.style.display = 'block'; 
               
               // Đổi màu tab
               allTabs.forEach(btn => btn.className = btn.className.replace('border-b-2 border-sky-500 text-sky-600', 'text-slate-500 hover:text-slate-700'));
               aiBtn.className = aiBtn.className.replace('text-slate-500 hover:text-slate-700', 'border-b-2 border-sky-500 text-sky-600');
            };
            
            // Phục hồi giao diện React khi bấm vào 3 tab gốc
            allTabs.forEach(btn => {
               if (btn !== aiBtn) {
                  btn.addEventListener('click', () => {
                     // Hiện lại tất cả nội dung React cũ
                     Array.from(mainContainer.children).forEach(child => {
                        if (child !== tabBar && child !== aiContainer) {
                           child.style.display = ''; // Trả về display CSS gốc
                        }
                     });
                     // Ẩn khung AI
                     aiContainer.style.display = 'none'; 
                     
                     // Reset màu tab AI
                     aiBtn.className = aiBtn.className.replace('border-b-2 border-sky-500 text-sky-600', 'text-slate-500 hover:text-slate-700');
                  });
               }
            });
          }
        }, 1000); // Chờ 1 giây để đảm bảo UI cũ đã load xong
      });
    </script>
  </body>
</html>
